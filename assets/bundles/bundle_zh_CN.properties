
block.ve-addon-momiji-item-liquid-junction.name = 物品液体交叉器
block.ve-addon-momiji-item-liquid-junction.description = 同时充当物品交叉器和液体交叉器。\n贴图是原版的物品交叉器和液体交叉器杂交来的。
block.ve-addon-momiji-item-liquid-junction.details = 桥工作岗位--。

block.ve-addon-momiji-power-drill-pro.name = 电洞钻头
block.ve-addon-momiji-power-drill-pro.description = 与相邻的电洞钻头共享物品容量，相互传递液体。\n贴图是VE本体的贴图改的。
block.ve-addon-momiji-power-drill-pro.details = 大钻头这一块。

block.ve-addon-momiji-beam-drill-pro.name = 电束钻头
block.ve-addon-momiji-beam-drill-pro.description = 能消耗水来加速的光束钻头，消耗更高但是能在更早的时期加速。\n贴图是VE本体的光束钻头换成了电解池的颜色。
block.ve-addon-momiji-beam-drill-pro.details = 光束钻头看到电动钻头能吃水加速十分羡慕，决定向电解池请教电解水的技巧。现在的它"放弃"了老久的外供氢气加速，换成了新式的先电解水再用氢气加速。不过因为没有盐和合金，电解效率较低。

block.ve-addon-momiji-rail-liquid-junction.name = 轨道液体交叉器
block.ve-addon-momiji-rail-liquid-junction.description = 同时充当轨道交叉器和液体交叉器。\n贴图是VE本体的轨道交叉器和液体交叉器杂交来的。
block.ve-addon-momiji-rail-liquid-junction.details = 电动钻头的好伙伴qwq。

block.ve-addon-momiji-isomorphic-unloader.name = 同构装卸器
block.ve-addon-momiji-isomorphic-unloader.description = 从周围建筑卸载指定物品。\n原版装卸器的赛克兰特版本。\n贴图是原版装卸器换色。
block.ve-addon-momiji-isomorphic-unloader.details = 转生到异世界了。

block.ve-addon-momiji-battery-item-bridge.name = 蓄电铁桥
block.ve-addon-momiji-battery-item-bridge.description = 火星特供加长储电铁桥，输出端（近乎）无限输出速率！\n贴图融合的蓄电池和铁桥。\n[accent]由于代码是ai写的，不确定对性能会有多大影响，使用时请尽量减少输出的物品种类和临近的建筑。\n理论上运输单种物品输出到单个建筑的话性能要优于原版桥。[]
block.ve-addon-momiji-battery-item-bridge.details = 什么? 这不是电池, 这是压缩铁桥。

block.ve-addon-momiji-cell-laboratory-pro.name = 抽奖实验室
block.ve-addon-momiji-cell-laboratory-pro.description = 有1/60概率产出硝烃藓，消耗孢子荚和植物质的期望与细胞实验室相同。\n理论上有63.66%的概率在60秒之前生产出至少1个硝烃藓。\n贴图直接使用的VE本体细胞实验室的贴图。
block.ve-addon-momiji-cell-laboratory-pro.details = 60秒有些太长了对吧, 来看看你的运气能不能给你节省时间把。uwu

block.ve-addon-momiji-salt-electrolyzer-pro.name = 联通电解池
block.ve-addon-momiji-salt-electrolyzer-pro.description = 与普通电解池相比，可以主动输出水。\n贴图基本就是VE本体的贴图，只加了个照葫芦画瓢画出的out贴图。\n[gray]没有电信的。[]
block.ve-addon-momiji-salt-electrolyzer-pro.details = 这就是我们热水沸腾的组合技!

block.ve-addon-momiji-sand-hoter.name = 沙子融化器
block.ve-addon-momiji-sand-hoter.description = 用爆炸混合物将沙子融化成熔岩。\n专门和熔岩冷却器对着干。\n贴图是ve高炉换色。
block.ve-addon-momiji-sand-hoter.details = 冷知识，某些情况下溶解+油浸的dps比合金破灭高。\n不是油浸+溶解哦。

block.ve-addon-momiji-platform-theta-pro.name = 电动力西塔平台
block.ve-addon-momiji-platform-theta-pro.description = 使用电制造西塔的，更为昂贵的西塔平台。\n用于没有建造枪原料之一的氯气时，额外使用1/10核心建筑费用来cos核心。\n贴图依然是换色+小小幅度改动。
block.ve-addon-momiji-platform-theta-pro.details = 铝动力西塔平台()

